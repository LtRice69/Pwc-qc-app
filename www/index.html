<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</head><body>
<title>PWC QC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Shop-floor tablet app: one column, big touch targets, plywood-brown accent, pass/fail/load as semantic colors.
   Built as ONE self-contained page so the same file can be served by the Google script now and packed into an APK later. */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --ink:#1f2328; --mute:#66707a; --line:#d9d5cf; --soft:#ebe7e1;
  --accent:#7a4a26; --accent-ink:#ffffff; --accent-soft:#f2e7dc;
  --ok:#1f7a3f; --ok-soft:#e2f2e7; --bad:#b42318; --bad-soft:#fbe4e1; --warn:#9a5b00; --warn-soft:#fdf0d5; --info:#1d5f8c; --info-soft:#e1eef8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16191c; --panel:#1f2327; --ink:#e8e6e3; --mute:#9aa3ab; --line:#353b41; --soft:#2a2f34;
  --accent:#c98a55; --accent-ink:#1a120b; --accent-soft:#3a2a1d;
  --ok:#5cc983; --ok-soft:#173523; --bad:#ff8a7f; --bad-soft:#41201d; --warn:#f0b04a; --warn-soft:#3b2d12; --info:#7cbcea; --info-soft:#16303f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#16191c; --panel:#1f2327; --ink:#e8e6e3; --mute:#9aa3ab; --line:#353b41; --soft:#2a2f34;
  --accent:#c98a55; --accent-ink:#1a120b; --accent-soft:#3a2a1d;
  --ok:#5cc983; --ok-soft:#173523; --bad:#ff8a7f; --bad-soft:#41201d; --warn:#f0b04a; --warn-soft:#3b2d12; --info:#7cbcea; --info-soft:#16303f; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:820px;margin:0 auto}
/* tablet held sideways (Galaxy 1280x800): two columns, hardware in 2 columns, no change on phones */
.cols{display:grid;gap:4px 22px;grid-template-columns:minmax(0,1fr)}
.cols > div{min-width:0}
@media (min-width:1000px){ .wrap{max-width:1240px} .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .cols.side{grid-template-columns:minmax(0,1fr) 360px} .cols.side > .aside{grid-column:2;grid-row:1;position:sticky;top:76px;align-self:start} .cols.side > .main{grid-column:1;grid-row:1}
  .hwgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:22px} }
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 12px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hback{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 15px var(--sans);cursor:pointer}
.htitle{font-weight:500;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .phx{display:flex;height:100%;align-items:center;justify-content:center;font-size:11px;color:var(--mute)}
.brand{font-weight:600;letter-spacing:.12em;font-size:15px}
.brand small{letter-spacing:0;font-weight:500;color:var(--mute);margin-left:6px}
.grow{flex:1;min-width:0}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:6px;font:500 13px var(--sans);color:var(--mute);cursor:pointer;min-height:34px}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
h1{font-size:20px;margin:6px 0 2px;text-wrap:balance}
h2{font-size:16px;margin:16px 0 6px}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 14px var(--sans);cursor:pointer;text-decoration:none}
.btn:focus-visible,.seg button:focus-visible,.li:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:52px;font-size:16px;margin-top:14px}
.btn.small{min-height:36px;padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{border:0;background:transparent;font:500 15px var(--sans);color:var(--accent);cursor:pointer;min-height:40px;padding:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:58px;min-height:44px;padding:6px 12px;font:500 14px var(--sans);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.yes{background:var(--ok);color:#fff}

label.f{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px;font-weight:500}
input[type=text],input[type=search],textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:15px var(--sans);padding:9px 11px}
textarea{min-height:70px;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px;background:var(--panel);width:100%;text-align:left;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit}
.li:last-child{border-bottom:0}
.li .mark{width:22px;text-align:center;font-weight:600}
.li .t{flex:1;min-width:0}
.li .t > b{display:block}
label.li{cursor:pointer}
.li .t span{color:var(--mute);font-size:13px}
.room{padding:7px 14px;background:var(--soft);font-weight:600;font-size:13px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .mute{color:var(--mute)}
.banner{border-radius:var(--r);padding:10px 12px;margin:10px 0;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.info{background:var(--info-soft);color:var(--info)} .banner.ok{background:var(--ok-soft);color:var(--ok)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.ph{position:relative;width:78px;height:62px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;cursor:pointer;padding:0}
.ph .w{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:600;background:var(--warn);color:#fff;text-align:center;padding:1px}
.camera{position:relative;overflow:hidden}
.camera input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.hwrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hwrow:last-child{border-bottom:0}
.hwrow .ex{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--mono);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums;display:block}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--mute);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:500;z-index:20;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet .in{background:var(--panel);border-radius:14px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}
.testbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute);margin:6px 0 2px}
.testbar label{display:inline-flex;gap:6px;align-items:center;min-height:36px}
.mail{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px;margin-top:6px}
.cam{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam .flash.go{animation:fl .25s ease-out}
@keyframes fl{from{opacity:.7}to{opacity:0}}
.cambar{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:#111}
.camthumbs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto}
.camthumbs img{width:54px;height:42px;object-fit:cover;border-radius:5px;border:1px solid #444;flex:none}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#e9e9e9;cursor:pointer;flex:none}
.shutter:active{background:#bbb}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header class="top">
  <button class="hback" id="hdrBack" hidden aria-label="Back">‹ Back</button>
  <span class="brand">PWC QC<small id="modeTag">test mode</small></span>
  <span class="grow htitle" id="hdrTitle"></span>
  <span id="netTag"></span>
  <div class="tabs" role="tablist" id="viewTabs"><button id="tabTablet" class="on">Tablet</button><button id="tabOffice">Office (test)</button></div>
</header>
<main id="app"></main>
</div>

<script>
"use strict";
/* ============================================================
   PWC QC - tablet app (v1.0, 2026-11-16)
   Pallet first: start a pallet -> tick what's on it (all count as passed) -> mark only the failed ones -> pallet photos -> label? -> at Send: truck photo or skip.
   - MODE "demo": everything stays in this browser (sample jobs, a pretend server and a pretend office PC).
   - MODE "live": the same page served by the PWC QC Google script (Index.html sets window.PWC_QC_CONFIG = {mode:"live"}); calls go through google.script.run.
   - MODE "app": the same page inside the Android APK (Capacitor). Calls go to the Google script's web app link (doPost, actions t*); the link + key word are typed once on the tablet.
   One self-contained file -> can be packed into an Android APK later as-is.
   ============================================================ */
const MODE = (window.PWC_QC_CONFIG && window.PWC_QC_CONFIG.mode) || "demo";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtT = t => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const STD_HW = ["Grommet", "Brackets", "Shelf Clip", "Extra Key", "Alum. Counter Support", "Screw For Alum Angle To Counter-Top", "Extra Feet", "Leg Adjustment Tool", "Extra Toe Clip", "Biscuit Joint", "Field Seam Kit", "Aluminum Angle"];

/* ---------- storage: IndexedDB (falls back to memory) ---------- */
const Store = (() => {
  let db = null, mem = {};
  const open = () => new Promise(res => { try { const r = indexedDB.open("pwc_qc", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => res(); } catch (e) { res(); } });
  const get = k => new Promise(res => { if (!db) return res(mem[k]); try { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(mem[k]); } catch (e) { res(mem[k]); } });
  const set = (k, v) => new Promise(res => { mem[k] = v; if (!db) return res(); try { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });
  return { open, get, set };
})();

/* ---------- sample jobs (what the office PC sends from A:) ---------- */
function demoJobs() {
  const cab = (num, name, room, load, qty) => ({ id: "c:" + num + "@" + norm(room), kind: "cab", num, name, room, load: load || 1, qty: qty || 1 });
  const prt = (num, name, room, load, qty) => ({ id: "p:" + num + "@" + norm(room), kind: "part", num, name, room, load: load || 1, qty: qty || 1 });
  return [
    { name: "Stevens - Kiddie Academy", hasList: true, loads: 2, hwFrom: "Hardware Picture List",
      cabinets: [cab("B1", "Base 2-door 36\"", "101 Reception"), cab("B2", "Base drawer 18\"", "101 Reception"), cab("B3", "Base 2-door 30\"", "101 Reception"), cab("W1", "Wall 1-door 18\"", "101 Reception", 1, 2), cab("W2", "Wall 2-door 30\"", "101 Reception"),
        cab("B10", "Base 2-door 36\"", "104 Classroom"), cab("B11", "Base drawer 18\"", "104 Classroom"), cab("B12", "Base sink 36\"", "104 Classroom"), cab("B13", "Base drawer 18\"", "104 Classroom"), cab("T1", "Tall pantry 24\"", "104 Classroom"),
        cab("B20", "Base 2-door 30\"", "110 Staff", 2), cab("B21", "Base sink 33\"", "110 Staff", 2), cab("W20", "Wall 2-door 30\"", "110 Staff", 2), cab("T20", "Tall locker 18\"", "110 Staff", 2)],
      parts: [prt("F1", "Filler 3\" x 30\"", "101 Reception"), prt("F2", "Filler 3\" x 30\"", "104 Classroom"), prt("EP1", "End panel 24\" x 34-1/2\"", "104 Classroom", 1, 2), prt("CT1", "PLAM top 96\" x 25\"", "104 Classroom"), prt("TK1", "Toe kick 96\"", "110 Staff", 2, 3)],
      hardware: ["Grommet 2\" black", "Shelf clip 5mm", "Extra key (cam lock)", "Adjustable leg", "Hafele lift (special order)", "Aluminum counter support 18\"", "Wire pull 4\" SS", "Touch latch"] },
    { name: "Hargrave - Lemont Fire Station #4", hasList: true, loads: 1, hwFrom: "",
      cabinets: [cab("B1", "Base 2-door 36\"", "Kitchen"), cab("B2", "Base drawer 24\"", "Kitchen"), cab("B3", "Base sink 36\"", "Kitchen"), cab("W1", "Wall 2-door 36\"", "Kitchen"), cab("W2", "Wall 2-door 30\"", "Kitchen"), cab("T1", "Tall pantry 30\"", "Day Room")],
      parts: [prt("F1", "Filler 3\" x 34-1/2\"", "Kitchen"), prt("ST1", "Solid surface top 120\"", "Kitchen")], hardware: [] },
    { name: "W.B. Olson - Campbell Laundry", hasList: false, loads: 1, cabinets: [], parts: [], hardware: [] },
    { name: "Manusos - Mundelein Phase 2", hasList: true, loads: 1, hwFrom: "Hardware Picture List",
      cabinets: [cab("B1", "Base 2-door 36\"", "Lobby"), cab("B2", "Base 2-door 36\"", "Lobby"), cab("RC1", "Reception counter", "Lobby")],
      parts: [prt("TP1", "Transaction top 72\"", "Lobby")], hardware: ["Grommet 3\" silver", "Keyboard tray"] }
  ];
}
function demoServerStart() {   /* one report "sent yesterday" so the lists show real status */
  const y = Date.now() - 864e5;
  const it = (kind, num, name, room, pallet, pass, comment) => ({ kind, key: (kind === "cab" ? "c:" : "p:") + num + "@" + norm(room), num, name, room, load: 1, pallet, pass, photos: [], comment: comment || "" });
  return { reports: [
    { id: "r_demo1", job: "Stevens - Kiddie Academy", by: "TN", t: y, items: [
      it("cab", "B1", "Base 2-door 36\"", "101 Reception", "P-01", true), it("cab", "B2", "Base drawer 18\"", "101 Reception", "P-01", true),
      it("cab", "B12", "Base sink 36\"", "104 Classroom", "P-02", false, "Chip on left end panel"), it("part", "F2", "Filler 3\" x 30\"", "104 Classroom", "P-02", false, "Wrong length")],
      pallets: [{ pallet: "P-01", load: 1, keys: ["c:B1@101reception", "c:B2@101reception"], photos: [{ id: "x", data: "" }], label: false, loaded: false, loadPhotos: [], loadKeys: [] },
                { pallet: "P-02", load: 1, keys: ["c:B12@104classroom", "p:F2@104classroom"], photos: [{ id: "y", data: "" }], label: true, loaded: false, loadPhotos: [], loadKeys: [] }],
      hw: null, loadQ: [{ load: 1, cleat: "Yes", print: "Yes", printPhoto: [] }], filed: true }
  ], emails: [], filed: [], labels: [{ job: "Stevens - Kiddie Academy", pallet: "P-02", load: 1, t: y, by: "TN", printed: true }] };
}

/* ---------- API: demo (pretend server in this browser) / live (Google script) ---------- */
const API = {
  async jobs() { if (MODE === "demo") { ST.listsT = Date.now(); return demoJobs(); } return liveCall("jobs"); },
  async reports(job) { if (MODE === "demo") return (await srv()).reports.filter(r => r.job === job); return liveCall("reports", { job }); },
  async send(rep) {
    if (MODE !== "demo") return liveCall("send", rep);
    if (ST.offline) throw new Error("No Wi-Fi");
    await new Promise(r => setTimeout(r, 400));
    const s = await srv(); if (s.reports.some(r => r.id === rep.id)) return { ok: true };
    s.reports.push(Object.assign({}, rep, { received: Date.now() }));
    const fails = failedIn(rep);
    if (fails.length) s.emails.push({ t: Date.now(), subject: `QC FAILED - ${rep.job}`, body: `${rep.by} marked ${plural(fails.length, "item")} as failed QC on ${fmtT(rep.t)}:\n` + fails.map(f => `  - ${f.pallet ? f.pallet + " " : ""}${f.num} ${f.name || ""}${f.room ? " (" + f.room + ")" : ""}: ${f.comment || "no comment"}`).join("\n") + `\n\nThe report and photos will be filed in ${rep.job}\\08 Shop Documents\\QC Report.` });
    for (const p of rep.pallets || []) if (p.label === true && !s.labels.some(l => l.job === rep.job && l.pallet === p.pallet)) s.labels.push({ job: rep.job, pallet: p.pallet, load: p.load, t: Date.now(), by: rep.by, printed: false });
    await Store.set("demoServer", s); return { ok: true };
  }
};
/* live: google.script.run -> Code.gs (qcJobs / qcReports / qcPhoto / qcSubmit); photos are uploaded one by one first */
function gsr(fn, ...args) { return new Promise((res, rej) => { try { google.script.run.withSuccessHandler(r => { if (r && r.error) { const e = new Error(r.error); e.server = true; rej(e); } else res(r); }).withFailureHandler(e => rej(new Error((e && e.message) || "No connection")))[fn](...args); } catch (e) { rej(new Error("No connection")); } }); }
const PHOTO_KEYS = ["photos", "labelPhoto", "loadPhotos", "printPhoto", "extraPhotos", "loadedPhotos"];
function eachPhoto(rep, cb) {
  (rep.items || []).forEach(it => { (it.photos || []).forEach((p, i) => cb(p, `${it.pallet ? it.pallet + "_" : ""}${it.num}_${i + 1}.jpg`)); (it.labelPhoto || []).forEach((p, i) => cb(p, `${it.num}_label_${i + 1}.jpg`)); });

/* ---------- status of items and pallets, worked out from reports (same rules will run in the Google script and the PWC app) ---------- */
function statusFrom(reports) {
  const items = {}, pallets = {}, loadQ = {}, hwDone = {};
  const sorted = reports.slice().sort((a, b) => a.t - b.t);
  const P = name => pallets[name] || (pallets[name] = { keys: [], load: 1, photos: 0, label: null, loaded: false, loadPhotos: 0 });
  for (const r of sorted) {
    for (const it of r.items || []) {
      const s = items[it.key] || (items[it.key] = { checks: [], passCount: 0, last: null, loaded: false, manual: !!it.manual, num: it.num, name: it.name, room: it.room, kind: it.kind, failedOnce: null, pallet: "" });
      s.checks.push({ t: r.t, by: r.by, pass: it.pass, comment: it.comment, pallet: it.pallet });
      if (it.pass) s.passCount++; else s.failedOnce = s.failedOnce || { t: r.t, by: r.by, comment: it.comment };
      s.last = { t: r.t, by: r.by, pass: it.pass, comment: it.comment, pallet: it.pallet };
      if (it.pallet) { s.pallet = it.pallet; const p = P(it.pallet); if (!p.keys.includes(it.key)) p.keys.push(it.key); }
    }
    for (const q of r.pallets || []) {
      const p = P(q.pallet); p.load = q.load || p.load;
      for (const k of q.keys || []) if (!p.keys.includes(k)) p.keys.push(k);
      p.photos += (q.photos || []).length; if (q.label != null) p.label = q.label;
      if (q.loaded) { p.loaded = true; p.loadPhotos += (q.loadPhotos || []).length; for (const k of q.loadKeys || []) if (items[k]) items[k].loaded = true; }
    }
    if (r.hw) hwDone[r.hw.load || 1] = { by: r.by, t: r.t, loaded: r.hw.loaded === true };
    for (const q of r.loadQ || []) loadQ[q.load] = { cleat: q.cleat, print: q.print, by: r.by, t: r.t, hasPhoto: !!(q.printPhoto || []).length };
  }
  for (const k in items) { const s = items[k]; if (s.pallet) for (const n in pallets) if (n !== s.pallet) pallets[n].keys = pallets[n].keys.filter(x => x !== k); }
  return { items, pallets, loadQ, hwDone, reports: sorted.length, lastT: sorted.length ? sorted[sorted.length - 1].t : 0, lastBy: sorted.length ? sorted[sorted.length - 1].by : "" };
}

/* ---------- photos: shrink to 1600px JPEG, warn if dark or blurry ---------- */
function readPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = () => rej(new Error("Couldn't read the photo"));
    fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("Not a photo")); img.onload = () => {
      res(photoFrom(img, img.width, img.height)); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
/* one photo from an image or a live camera frame: 1600px JPEG + dark / blurry check */
function photoFrom(src, sw, sh) {
      const max = 1600, sc = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * sc), h = Math.round(sh * sc);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(src, 0, 0, w, h);
      const data = c.toDataURL("image/jpeg", 0.78);
      const s = 128, c2 = document.createElement("canvas"); c2.width = s; c2.height = s; const x2 = c2.getContext("2d"); x2.drawImage(src, 0, 0, s, s);
      const px = x2.getImageData(0, 0, s, s).data, g = new Float32Array(s * s); let sum = 0;
      for (let i = 0; i < s * s; i++) { g[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]; sum += g[i]; }
      let lap = 0, lap2 = 0, n = 0; for (let y = 1; y < s - 1; y++) for (let xx = 1; xx < s - 1; xx++) { const i = y * s + xx; const v = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - s] - g[i + s]; lap += v; lap2 += v * v; n++; }
      const mean = sum / (s * s), sharp = lap2 / n - (lap / n) ** 2;
      return { id: uid(), data, w, h, warn: mean < 45 ? "Too dark" : sharp < 40 ? "Blurry" : "" };
}

/* ---------- APK: in-app update check (GitHub Releases of the app's repo) ---------- */
async function checkAppUpdate() {
  const B = window.PWC_QC_BUILD || {}; if (!B.repo || !navigator.onLine) return;
  try { const r = await fetch(`https://api.github.com/repos/${B.repo}/releases/latest`, { headers: { Accept: "application/vnd.github+json" } }); if (!r.ok) return; const rel = await r.json();
    const v = String(rel.tag_name || "").replace(/^v/, ""), num = x => String(x).split(".").map(n => +n || 0), a = num(v), b = num(B.version || "0");
    let newer = false; for (let i = 0; i < Math.max(a.length, b.length); i++) { if ((a[i] || 0) !== (b[i] || 0)) { newer = (a[i] || 0) > (b[i] || 0); break; } }
    const apk = (rel.assets || []).find(x => /\.apk$/i.test(x.name)); if (!newer || !apk) return;
    sheet(`<h2 style="margin-top:0">Update available</h2><p class="sub">PWC QC ${esc(v)} is ready (this tablet has ${esc(B.version)}). Reports waiting to send are kept.</p>
      <ol class="sub" style="padding-left:18px"><li>Tap <b>Download update</b>.</li><li>Open the downloaded file and tap <b>Install</b> (allow "install unknown apps" the first time).</li></ol>
      <div class="row"><button class="btn primary" id="upGo">Download update</button><button class="btn" data-close>Later</button></div>`, sh => {
      $("upGo").onclick = async () => { const url = apk.browser_download_url; try { const L = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppLauncher; if (L) await L.openUrl({ url }); else window.open(url, "_blank"); } catch (e) { window.open(url, "_blank"); } sh.remove(); }; });
  } catch (e) {}
}
/* ---------- sending ---------- */
let flushing = false;
async function flushOutbox(fromSend) {
  if (flushing || !ST.outbox.length) return; flushing = true; let sent = 0, err = "";
  while (ST.outbox.length) { const r = ST.outbox[0]; try { await API.send(r); ST.outbox.shift(); r.sentOk = true; ST.sentLog.push({ id: r.id, job: r.job, by: r.by, t: r.t, sentT: Date.now() }); sent++; persist(); } catch (e) { err = e.message; break; } }
  flushing = false;
  if (sent) { await loadReportsAll(); toast(`✔ Sent ${plural(sent, "report")}.`); }
  else if (fromSend && err) toast("No Wi-Fi - the report is waiting to send.", 3500);
  render();
}
setInterval(() => { if (ST.outbox.length) flushOutbox(); }, 15000);
window.addEventListener("online", () => flushOutbox());
async function loadLists() { try { ST.jobs = (await API.jobs()).concat(ST.jobs.filter(j => j.other)); await loadReportsAll(); persist(); } catch (e) { if (e.server && /key/i.test(e.message)) { ST.key = ""; await Store.set("key", ""); ST.screen = "key"; } else toast("Couldn't get the job lists (no Wi-Fi?). Using the last lists on this tablet.", 4000); } }
async function loadReportsAll() { for (const j of ST.jobs) { if (MODE !== "demo" && !j.hasList && !ST.drafts[j.name] && !(ST.reps[j.name] || []).length && j !== job()) continue; try { ST.reps[j.name] = await API.reports(j.name); } catch (e) {} } }

    <h2>🏷 Pallet labels to print</h2>${labels.length ? `<div class="list">${labels.map((l, i) => `<div class="li" style="cursor:default"><span class="tag" style="min-width:52px">${esc(l.pallet)}</span><span class="t"><b>${esc(l.job)}</b><span>Load ${l.load} · asked by ${esc(l.by)} ${fmtT(l.t)}</span></span><button class="btn small primary" data-lbl="${s.labels.indexOf(l)}">Print label (test)</button></div>`).join("")}</div>` : `<div class="card mute">No labels waiting.</div>`}
    <h2>📧 Emails sent to Martin (failed QC)</h2>${s.emails.length ? s.emails.slice().reverse().map(m => `<div class="card"><b>${esc(m.subject)}</b> <span class="sub">${fmtT(m.t)}</span><div class="mail">${esc(m.body)}</div></div>`).join("") : `<div class="card mute">None yet. Fail an item on the tablet and send.</div>`}
    <h2>QC summary</h2>${jobsW.length ? `<div class="chips" style="margin-bottom:8px">${jobsW.map(n => `<button class="chip ${n === oj ? "on" : ""}" data-oj="${esc(n)}" style="font-family:var(--sans)">${esc(n)}</button>`).join("")}</div>${summaryHtml(oj, s)}` : `<div class="card mute">No reports yet.</div>`}`;
  app.querySelectorAll("[data-oj]").forEach(b => b.onclick = () => { ST.officeJob = b.dataset.oj; render(); });
  app.querySelectorAll("[data-delrec]").forEach(b => b.onclick = () => { const r = s.reports.find(x => x.id === b.dataset.delrec);
    sheet(`<h2 style="margin-top:0">Delete the online record?</h2><p class="sub">${esc(r.job)} · ${esc(r.by)} ${fmtT(r.t)}<br>Removes the report and its photos from your Google Drive. The files on A: are not touched.</p><div class="row"><button class="btn primary" id="drGo">Delete record</button><button class="btn" data-close>Cancel</button></div>`, sh => {
      $("drGo").onclick = async () => { const strip = o => { if (Array.isArray(o)) o.forEach(strip); else if (o && typeof o === "object") for (const k in o) { if (/^(photos|labelPhoto|loadPhotos|printPhoto|extraPhotos|loadedPhotos)$/.test(k) && Array.isArray(o[k])) o[k] = o[k].map(() => ({ id: "x", data: "" })); else strip(o[k]); } };
        strip(r); r.deleted = true; await Store.set("demoServer", s); sh.remove(); toast("Online record deleted."); render(); }; }); });
  app.querySelectorAll("[data-lbl]").forEach(b => b.onclick = async () => { const l = s.labels[+b.dataset.lbl]; l.printed = true; await Store.set("demoServer", s); const S = statusFrom(s.reports.filter(r => r.job === l.job)); const keys = (S.pallets[l.pallet] || { keys: [] }).keys; const nums = keys.map(k => S.items[k] ? S.items[k].num : k.split(":")[1].split("@")[0]);
    sheet(`<h2 style="margin-top:0">Pallet label (DYMO)</h2><div class="card" style="font-family:var(--mono)"><div style="font-size:13px">${esc(l.job)}</div><div style="font-size:30px;font-weight:600">${esc(l.pallet)}</div><div>Load ${l.load}</div><div style="font-size:12px;margin-top:4px">${esc(nums.join(", "))}</div></div><p class="sub">In the real app this prints on the DYMO with the label app.</p><div class="row"><button class="btn" data-close>Close</button></div>`); render(); });
  app.querySelectorAll("[data-file]").forEach(b => b.onclick = async () => {
    const r = s.reports.find(x => x.id === b.dataset.file); r.filed = true;
    const d = new Date(r.t), stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + "_" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "_" + r.by;
    const names = []; for (const p of r.pallets || []) { p.photos.forEach((_, i) => names.push(`${p.pallet}_pallet_${i + 1}.jpg`)); (p.loadPhotos || []).forEach((_, i) => names.push(`${p.pallet}_truck_${i + 1}.jpg`)); }
    for (const it of r.items || []) it.photos.forEach((_, i) => names.push(`${it.pallet ? it.pallet + "_" : ""}${it.num}_${i + 1}.jpg`));
    const S = statusFrom(s.reports.filter(x => x.job === r.job));
    const shipped = (r.pallets || []).filter(p => p.loaded).flatMap(p => p.loadKeys.map(k => S.items[k] ? S.items[k].num : k));
    s.filed.push(`A:\\Jobs\\${r.job}\\08 Shop Documents\\QC Report\\QC_${stamp}.pdf\nA:\\Jobs\\${r.job}\\08 Shop Documents\\QC Report\\Photos\\${stamp}\\  ${names.slice(0, 6).join("  ")}${names.length > 6 ? "  …" : ""}\nShipping Check List: Shipped ticked for ${shipped.length ? shipped.join(", ") : "nothing (no pallet loaded in this report)"}`);
    await Store.set("demoServer", s); toast("Filed (test)."); render(); });
}
function summaryHtml(name, s) {
  const j = ST.jobs.find(x => x.name === name) || { name, cabinets: [], parts: [], hardware: [], loads: 1 };
  const S = statusFrom(s.reports.filter(r => r.job === name)); const all = itemsOf(j);
  const st = it => itemState(it, S);
  const cDone = all.filter(i => i.kind === "cab" && st(i).done).length, cTot = all.filter(i => i.kind === "cab").length, pDone = all.filter(i => i.kind === "part" && st(i).done).length, pTot = all.filter(i => i.kind === "part").length, loaded = all.filter(i => S.items[i.id] && S.items[i.id].loaded).length;
  const bad = Object.values(S.items).filter(x => x.last && x.last.pass === false), rech = Object.values(S.items).filter(x => x.failedOnce && x.last && x.last.pass), hand = Object.values(S.items).filter(x => x.manual), notDone = all.filter(i => !S.items[i.id]);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const pals = sortP(Object.keys(S.pallets));
  return `<div class="sumgrid"><div class="stat">Cabinets<b>${cDone} of ${cTot}</b><div class="bar"><i style="width:${pct(cDone, cTot)}%"></i></div></div>
    <div class="stat">Loose parts<b>${pDone} of ${pTot}</b><div class="bar"><i style="width:${pct(pDone, pTot)}%"></i></div></div>
    <div class="stat">Loaded<b>${loaded} of ${all.length}</b><div class="bar"><i style="width:${pct(loaded, all.length)}%;background:var(--info)"></i></div></div>
    <div class="stat">Failed open<b class="${bad.length ? "bad" : ""}">${bad.length}</b></div></div>
    <div class="card scroll"><table class="t"><tr><th>Pallet</th><th>Load</th><th>Items</th><th>Photos</th><th>Label</th><th>Loaded</th></tr>${pals.map(p => { const P = S.pallets[p]; return `<tr><td class="tag">${esc(p)}</td><td>${P.load}</td><td>${P.keys.map(k => S.items[k] ? esc(S.items[k].num) + (S.items[k].last.pass ? "" : " ✕") : esc(k.split(":")[1].split("@")[0]) + " ○").join(", ")}</td><td>${P.photos || `<span class="bad">0</span>`}</td><td>${P.label ? "🏷 yes" : P.label === false ? "no" : "-"}</td><td>${P.loaded ? "🚚 yes" : "-"}</td></tr>`; }).join("") || `<tr><td colspan="6" class="mute">No pallets.</td></tr>`}</table></div>
    <div class="card scroll"><table class="t"><tr><th>Load</th><th>Hanging cleat / toe kick</th><th>Installation print</th></tr>${Array.from({ length: j.loads || 1 }, (_, k) => { const q = S.loadQ[k + 1]; return `<tr><td>Load ${k + 1}</td><td>${q ? esc(q.cleat) + " · " + esc(q.by) : `<span class="mute">not asked yet</span>`}</td><td>${q ? esc(q.print) + (q.hasPhoto ? " 📷" : "") : `<span class="mute">not asked yet</span>`}</td></tr>`; }).join("")}</table></div>
    <div class="card scroll"><b>Needs attention</b><table class="t" style="margin-top:6px">
      ${bad.map(x => `<tr><td class="bad">✕ <span class="tag">${esc(x.num)}</span> ${esc(x.name || "")}</td><td>failed ${fmtT(x.last.t)} ${esc(x.last.by)} "${esc(x.last.comment || "")}"</td></tr>`).join("")}
      ${rech.map(x => `<tr><td class="ok">✔ <span class="tag">${esc(x.num)}</span> ${esc(x.name || "")}</td><td>failed ${fmtT(x.failedOnce.t)} → re-checked, passed ${esc(x.last.by)} ${fmtT(x.last.t)}</td></tr>`).join("")}
      ${notDone.length ? `<tr><td class="warn">○ ${notDone.map(i => esc(i.num)).join(", ")}</td><td>no QC yet</td></tr>` : ""}
      ${hand.map(x => `<tr><td class="warn">+ <span class="tag">${esc(x.num)}</span> ${esc(x.name || "")}</td><td>added by hand - not on the packing list</td></tr>`).join("")}
      ${!bad.length && !rech.length && !notDone.length && !hand.length ? `<tr><td class="ok">All done.</td><td></td></tr>` : ""}</table></div>
    <div class="sub">Reports: ${S.reports} · last ${S.lastT ? fmtT(S.lastT) + " " + esc(S.lastBy) : "-"}. The office app can print this summary into the QC Report folder.</div>`;
}

/* ---------- start ---------- */
$("tabTablet").onclick = () => { ST.view = "tablet"; render(); };

$("hdrBack").onclick = back;
(async () => {
  await Store.open();
  try { const t = await Store.get("tablet"); if (t) Object.assign(ST, { drafts: t.drafts || {}, outbox: t.outbox || [], sentLog: t.sentLog || [], jobs: t.jobs || [], manual: t.manual || {}, recent: t.recent || [], listsT: t.listsT || 0 }); } catch (e) {}
  $("modeTag").textContent = MODE === "demo" ? "test mode" : "";
  if (MODE !== "demo") { $("viewTabs").hidden = true; ST.key = (await Store.get("key")) || ""; ST.url = (await Store.get("url")) || ""; if (!ST.key || (MODE === "app" && !ST.url)) { ST.screen = "key"; render(); return; } }
  if (MODE === "app") setTimeout(checkAppUpdate, 4000);
  try { history.replaceState({ qc: 0 }, ""); } catch (e) {}
  await loadLists(); render(); if (ST.outbox.length) flushOutbox();
})();

</script>
